# Overrides on top of detekt 2.0's default rule set (buildUponDefaultConfig = true).
# Keys checked against default-detekt-config.yml in dev.detekt:detekt-core:2.0.0-alpha.6.
config:
  validation: true
  warningsAsErrors: true

naming:
  FunctionNaming:
    # Composable functions are named like types (Compose API guidelines).
    ignoreAnnotated:
      - Composable
