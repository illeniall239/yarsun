# Every version here is pinned on purpose (plan S1); change one only with a fresh
# `--write-locks` and `--write-verification-metadata sha256` run (see README).
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
detekt = "1.23.8"
junit = "4.13.2"
robolectric = "4.17"
# The Android framework jar Robolectric 4.17 runs SDK 36 tests on; fetched by Gradle
# (so dependency verification covers it) instead of by Robolectric at test time.
robolectricAndroidAll = "16-robolectric-13921718-i7"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
kotest = "6.2.6"
# Floors for libraries that AGP and Lint pull in transitively at build time (never shipped);
# each lifts a version with a published advisory found by osv-scanner (see README).
bouncycastle = "1.86"
jose4j = "0.9.7"
jdom2 = "2.0.6.1"
commonsLang3 = "3.21.0"
httpclient = "4.5.14"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
robolectric-android-all = { module = "org.robolectric:android-all-instrumented", version.ref = "robolectricAndroidAll" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }

bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4j" }
jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commonsLang3" }
httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclient" }

[bundles]
build-tool-security-floors = [
    "bouncycastle-bcprov", "bouncycastle-bcpkix", "bouncycastle-bcutil",
    "jose4j", "jdom2", "commons-lang3", "httpclient",
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 compiles Kotlin itself (built-in Kotlin) but ships KGP 2.2.10; declaring this
# plugin with `apply false` in the root build only lifts the compiler to 2.4.x.
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
